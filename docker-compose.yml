services:
  web:
    build: .
    container_name: fastapi_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_USER=${DB_USER:-cft2026_appmoviles}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-cft2026_appmoviles}
      - DB_PORT=${DB_PORT:-3306}
    volumes:
      - .:/app
